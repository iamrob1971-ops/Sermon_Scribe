<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sermon &amp; Devotional Scribe</title>
<!-- Microsoft Authentication Library (MSAL) -->
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAF3;--paper:#FBFAFD;--ink:#1D1930;--muted:#6E6A82;--line:#D9D5E6;
  --violet:#5B3F98;--violet-d:#46307A;--violet-t:#EFEAFA;--live:#D43A52;
  --gold:#A9782A;--gold-t:#F6EEDC;--green:#2E6E5A;--green-t:#E3F0EA;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
body[data-mode="devotional"]{
  --violet:#3A5A40;--violet-d:#283E2C;--violet-t:#EAF0EB;
  --gold:#8C6239;--gold-t:#F5EDE4;--bg:#E9EDE9;--line:#CFD8D0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;padding:20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.shell{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(380px,1.1fr);gap:20px;align-items:start}
header.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 0;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.01em}
.brand small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:10px;font-weight:400}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#B9B5CB}
.pill.live{color:var(--live);border-color:#F0C3CC}
.pill.live .dot{background:var(--live)}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:var(--green-t);color:var(--green);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.scribe{display:flex;flex-direction:column;min-height:calc(100vh - 100px)}
.scribe-head{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.rec{position:relative;flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--violet);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.rec:hover{background:var(--violet-d)}
.rec svg{width:26px;height:26px}
.rec .ic-stop{display:none}
.rec.on{background:var(--live)}
.rec.on .ic-mic{display:none}.rec.on .ic-stop{display:block}
.rec.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--live);opacity:.5;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:.6}to{transform:scale(1.18);opacity:0}}
.head-main{flex:1;min-width:0}
.title{width:100%;border:0;background:transparent;font-family:var(--serif);font-size:24px;font-weight:500;padding:0;letter-spacing:-.01em}
.title::placeholder{color:#A9A5BD}
.title:focus-visible{outline-offset:4px;border-radius:4px}
.meta{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:2px;align-items:center}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.bars i{width:3px;height:4px;background:#B9B5CB;border-radius:2px}
.on-air .bars i{background:var(--live);animation:bar 1s ease-in-out infinite}
.on-air .bars i:nth-child(2){animation-delay:.15s}.on-air .bars i:nth-child(3){animation-delay:.3s}
.on-air .bars i:nth-child(4){animation-delay:.45s}.on-air .bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:4px}50%{height:16px}}

/* Context Bar (Theme / Target Row) */
.ctx-bar{padding:10px 22px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;gap:12px;align-items:center;font-size:13px;flex-wrap:wrap}
.ctx-bar select,.ctx-bar input{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;background:#fff}

.ribbon{padding:10px 22px;border-bottom:1px solid var(--line);background:var(--gold-t);display:flex;gap:10px;align-items:center;min-height:48px;overflow-x:auto}
.ribbon .lbl{font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap}
.ribbon .empty{font-size:13px;color:var(--muted)}
.chip{white-space:nowrap;text-decoration:none;font-family:var(--serif);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid color-mix(in srgb,var(--gold) 35%,white);border-radius:6px;padding:2px 8px}
a.chip:hover{border-color:var(--gold)}

.transcript-area{flex:1;display:flex;flex-direction:column;position:relative}
textarea.page{
  flex:1;width:100%;padding:22px 28px;border:0;outline:none;background:transparent;resize:none;
  font-family:var(--serif);font-size:19px;line-height:1.7;color:var(--ink);min-height:280px;max-height:calc(100vh - 420px);
}
textarea.page::placeholder{color:#A9A5BD;font-family:var(--sans);font-size:15px;line-height:1.5}
.interim-preview{padding:4px 28px 10px;color:#9A96AE;font-style:italic;font-family:var(--serif);font-size:17px;display:none}
.notice{margin:12px 22px 0;padding:10px 14px;border-radius:8px;background:#FDECEF;color:#8E2236;font-size:13px;display:none}
.notice.show{display:block}

.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;font-size:13px;transition:.15s}
.btn:hover{border-color:#B1B8C8;background:#fff}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.primary:hover{background:var(--violet-d)}
.btn.success{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn.sm{padding:5px 9px;font-size:12px}
.spacer{flex:1}

/* NOTES & OVERLAY */
.notes{display:flex;flex-direction:column;min-height:calc(100vh - 100px);transition:all .2s ease}
.notes.overlay-mode{
  position:fixed;inset:16px;z-index:1000;max-height:calc(100vh - 32px);min-height:calc(100vh - 32px);
  box-shadow:0 16px 48px rgba(29,25,48,.32);
}
.notes.overlay-mode .out{max-height:none;font-size:18px;max-width:920px;margin:0 auto;width:100%}
.notes-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.notes-head h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:500}
.styleRow{display:flex;gap:8px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line)}
.styleRow select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:13px}
details.cfg{border-bottom:1px solid var(--line);padding:0 22px}
details.cfg summary{cursor:pointer;padding:10px 0;font-size:13px;color:var(--muted);font-weight:500}
.cfg-body{display:grid;gap:10px;padding:0 0 16px}
.cfg label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.cfg input[type=text],.cfg input[type=password],.cfg select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}

.out{
  flex:1;padding:20px 24px;overflow-y:auto;max-height:calc(100vh - 460px);min-height:240px;
  font-family:var(--serif);font-size:16px;line-height:1.6;outline:none;
}
.out[contenteditable="true"]{cursor:text}
.out h2,.out h3{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--violet);margin:1.3em 0 .3em;text-transform:uppercase;letter-spacing:0.04em}
.out h2:first-child,.out h3:first-child{margin-top:0}
.out ul,.out ol{margin:0 0 1em;padding-left:1.2em}
.out li{margin:.25em 0}
.out p{margin:.4em 0 1em}
.out blockquote{margin:.6em 0;padding:.2em 0 .2em 14px;border-left:3px solid var(--line);color:#4A4560}
.out pre{background:#231F33;color:#F1EFF8;padding:10px 14px;border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:13px;overflow-x:auto}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--sans);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#8E2236;font-family:var(--sans);font-size:13px;background:#FDECEF;padding:10px;border-radius:8px}

/* Progress Drawer / Log */
.sync-status{padding:10px 22px;background:#F6F5FB;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-family:Consolas,monospace;max-height:110px;overflow-y:auto;display:none}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:0;width:min(800px,94vw)}
dialog::backdrop{background:rgba(29,25,48,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:500}
.dlg-b{padding:16px 20px;display:grid;gap:10px}
.dlg-b textarea{width:100%;min-height:55vh;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5}
.dlg-f{display:flex;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9999}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  body{padding:12px}
  .shell{grid-template-columns:1fr}
  .scribe,.notes{min-height:0}
  textarea.page{max-height:45vh;padding:16px}
  .out{max-height:none}
}
</style>
</head>
<body data-mode="sermon">

<div class="shell" id="shell">
  <header class="top">
    <div class="brand"><span id="brand">Sermon Scribe</span><small id="sub">Live transcript, Reformed notes &amp; SharePoint sync</small></div>
    <div class="top-r">
      <div class="seg" role="group" aria-label="Mode">
        <button id="mSermon" aria-pressed="true">Sermon</button>
        <button id="mDevotional" aria-pressed="false">Devotional</button>
      </div>
      <span class="user-badge" id="userBadge" style="display:none">● <span id="userAccountName"></span></span>
      <button class="btn sm" id="authBtn">Sign in with Microsoft</button>
      <span class="pill" id="status"><span class="dot"></span><span id="statusText">Ready</span></span>
    </div>
  </header>

  <!-- TRANSCRIPT & INPUT -->
  <section class="card scribe" id="scribe" aria-label="Transcript">
    <div class="scribe-head">
      <button class="rec" id="recBtn" aria-label="Start listening">
        <svg class="ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
        <svg class="ic-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></svg>
      </button>
      <div class="head-main">
        <input class="title" id="title" type="text" placeholder="Title of Sermon or Devotional" aria-label="Title">
        <div class="meta" id="meta">
          <span id="timer">0:00</span>
          <span id="words">0 words</span>
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
    </div>

    <!-- Dynamic Context Bar (Theme for Sermon / Target Row for Devotional) -->
    <div class="ctx-bar" id="ctxBar">
      <div id="sermonCtx" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <b>Theme:</b>
        <select id="themeSelect">
          <option value="Signal Mountain Church Sermons">Signal Mountain Church Sermons</option>
          <option value="Spurgeon">Spurgeon</option>
          <option value="Other Sermons">Other Sermons</option>
          <option value="_custom">+ Create New Theme...</option>
        </select>
        <input type="text" id="customThemeInput" placeholder="New Theme Title..." style="display:none;width:180px">
      </div>
      <div id="devotionalCtx" style="display:none;gap:12px;align-items:center;flex-wrap:wrap">
        <span><b>Target Resource ID / Row:</b> <input type="number" id="targetResourceId" value="17" style="width:70px" title="SharePoint Resources item ID"></span>
        <span><b>Source:</b> <input type="text" id="devoSource" value="FCB" style="width:70px"></span>
        <span><b>Date:</b> <input type="date" id="devoDate"></span>
      </div>
    </div>

    <div class="notice" id="notice" role="alert"></div>
    <div class="ribbon" id="ribbon"></div>
    
    <div class="transcript-area">
      <textarea class="page" id="page" spellcheck="true"></textarea>
      <div class="interim-preview" id="interimBox"></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="copyBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        Copy transcript
      </button>
      <button class="btn" id="dlBtn" disabled>Save .txt</button>
      <button class="btn" id="sampleBtn">Load sample</button>
      <span class="spacer"></span>
      <button class="btn" id="clearBtn" disabled>Clear</button>
    </div>
  </section>

  <!-- STUDY NOTES & GRAPH SYNC -->
  <aside class="card notes" id="notesCard" aria-label="Notes">
    <div class="notes-head">
      <h2 id="notesTitle">Study Notes</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn sm" id="expandBtn" title="Expand notes full screen">⛶ Expand</button>
        <button class="btn primary" id="sumBtn" disabled>Summarize with AI</button>
      </div>
    </div>
    
    <div class="styleRow">
      <select id="preset" aria-label="Notes style"></select>
      <button class="btn sm" id="editInst">Edit instructions</button>
    </div>

    <details class="cfg" id="cfg">
      <summary>AI settings (free Gemini key)</summary>
      <div class="cfg-body">
        <label>API Key (Google AI Studio)
          <input type="password" id="key" autocomplete="off" placeholder="Paste your free Gemini key here">
        </label>
        <label>Model
          <select id="model"></select>
        </label>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn sm" id="checkKey" type="button">Verify key &amp; list models</button>
          <label class="row" style="font-size:12px;margin:0"><input type="checkbox" id="remember" checked> Remember on this device</label>
        </div>
      </div>
    </details>

    <div class="out" id="out" spellcheck="true"></div>
    <div class="sync-status" id="syncStatus"></div>

    <div class="actions">
      <button class="btn success" id="saveSharePointBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span id="saveSpBtnText">Save to SharePoint</span>
      </button>
      <button class="btn" id="copyNotes" disabled>Copy notes</button>
    </div>
  </aside>
</div>

<!-- INSTRUCTIONS MODAL -->
<dialog id="instDlg" aria-labelledby="dlgT">
  <div class="dlg-h"><h2 id="dlgT">AI Instructions</h2><button class="btn sm" id="dlgX" aria-label="Close">Close</button></div>
  <div class="dlg-b">
    <p id="dlgP"></p>
    <textarea id="instText" spellcheck="false"></textarea>
    <span class="count" id="instCount" style="font-size:12px;color:var(--muted)"></span>
  </div>
  <div class="dlg-f">
    <button class="btn primary" id="instSave">Save as my default</button>
    <button class="btn" id="instReset">Reset to built-in</button>
    <span class="spacer"></span>
    <button class="btn" id="instCancel">Cancel</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   SECTION 1 - SYSTEM PROMPTS (SERMON & SPURGEON DEVOTIONAL)
   ===================================================================== */
var DEVOTIONAL_SPURGEON = `You are expanding Charles Spurgeon's Faith's Checkbook devotionals into substantial family devotionals that are Scripture-governed, Christ-centered, grace-centered, Reformed in theological orientation, pastorally useful, and formatted for a family Bible Power App.

PRIMARY AUTHORITY
1. Scripture rules all doctrine, application, theological inference, and evaluation of Spurgeon. Scripture is final authority.
2. Historic Christian orthodoxy & Reformed theology (Spurgeon, Augustine, Calvin, Luther, Matthew Henry, Westminster Standards, Heidelberg Catechism, R. C. Sproul, PCA theology).
3. Bible Translation: Use WEB (World English Bible) for Scripture quotations. Preserve KJV only when quoting Spurgeon's historical text.

METHOD & STRUCTURE
1. Original context first. Trace canonical Christ-centered trajectory without artificial allegorizing.
2. Grace Order: Christ -> grace -> faith -> obedience. Justification is settled forensic foundation; sanctification is transformative construction.

\`\`\`tsv
PromiseNum{{TAB}}PromiseTitle{{TAB}}ScriptureWEBU{{TAB}}The Promise Itself{{TAB}}MeaningApplication{{TAB}}HistoricWitnesses{{TAB}}DoctrineTag{{TAB}}ExperienceTag{{TAB}}ScriptureRef{{TAB}}PromiseType{{TAB}}Audience{{TAB}}Response_ConditionType{{TAB}}Promise_Response_Notes{{TAB}}Body_Enrichment{{TAB}}BookNum{{TAB}}Chapter{{TAB}}VerseStart{{TAB}}VerseEnd{{TAB}}StartKey{{TAB}}EndKey{{TAB}}Tags{{TAB}}CrossRef{{TAB}}CrossRefKeys{{TAB}}PromiseKey{{TAB}}SharepointID{{TAB}}NeedsSync{{TAB}}SyncStatus
[Data row with 27 fields separated by {{TAB}}, ending with {{TAB}}{{TAB}}FALSE{{TAB}}Pending]
\`\`\``;

var SERMON_STANDARD = `You are a biblical research assistant producing an expositional, Christ-centered study of a sermon transcript. Interpret within historic Protestant, Reformed orthodoxy.

OUTPUT HEADINGS IN MARKDOWN:
## Main Idea
[Central thesis of the message]

## Key Takeaways
[4-6 bulleted takeaways grounded in the text]

## Scripture Focus
[Bulleted list: each reference cited and how the speaker used it]

## Theological Synthesis
[Doctrinal anchors: Christology, grace, justification, sanctification, providence]

## Application

## Reflection Questions
[5 searching questions for personal meditation]

Stay faithful to what was spoken in the transcript without introducing external teachings.`;

var PRESETS = {
  'sermon-std':    {mode:'sermon',     label:'Expository Sermon Notes',                text:SERMON_STANDARD},
  'devo-spurgeon': {mode:'devotional', label:"Spurgeon Faith's Checkbook Devotional",  text:DEVOTIONAL_SPURGEON}
};

/* =====================================================================
   SECTION 2 - MODES & CONFIG
   ===================================================================== */
var MODES = {
  sermon:{
    brand:'Sermon Scribe', sub:'Live transcript, Reformed notes & Devotional Topics',

  /* Markdown Parser */
  function mdToHtml(md){
    var lines=esc(md).split('\n'),html='',inUl=false,inOl=false,inCode=false;
    function inline(x){return x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
    lines.forEach(function(l){
      if(l.startsWith('```')){if(inCode){html+='</pre>';inCode=false}else{html+='<pre>';inCode=true}return}
      if(inCode){html+=l+'\n';return}
      var h=l.match(/^#{1,4}\s+(.*)/),ul=l.match(/^\s*[-*]\s+(.*)/),ol=l.match(/^\s*\d+\.\s+(.*)/);
      if(h){if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}html+='<h3>'+inline(h[1])+'</h3>'}
      else if(ul){if(!inUl){html+='<ul>';inUl=true}html+='<li>'+inline(ul[1])+'</li>'}
      else if(ol){if(!inOl){html+='<ol>';inOl=true}html+='<li>'+inline(ol[1])+'</li>'}
      else if(l.trim()){if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}html+='<p>'+inline(l)+'</p>'}

  }

  /* B. DEVOTIONAL MODE -> RESOURCES + COMPANION_VOICES + FAMILY_INSIGHTS */
 /* REFINED DEVOTIONAL PIPELINE - 100% PARITY WITH POWER APP BUTTONS */
  async function saveDevotionalPipeline(token, siteId){
    var rawText = out.innerText;
    var rawHtml = out.innerHTML;
    var targetRowId = $('targetResourceId').value.trim() || '17';
    var devoDate = $('devoDate').value || new Date().toISOString().slice(0,10);
    
    // Format date like "October 6" for titles to match Power Apps Text(locDevotionalDate, "mmmm d")
    var dObj = new Date(devoDate + 'T00:00:00');
    var monthDayStr = dObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
    var mmDdYyyyStr = (dObj.getMonth()+1) + '-' + dObj.getDate() + '-' + dObj.getFullYear();

    logSync('Beginning Devotional multi-list sync for date: ' + devoDate + ' (' + monthDayStr + ')...');

    // 1. Separate Top Commentary from Family Micro-Cards
    var familySplitIdx = rawText.search(/Family Micro-Cards/i);
    var topCommentary = rawHtml;
    var familyRaw = "";

    if (familySplitIdx > -1) {
      familyRaw = rawText.slice(familySplitIdx);
      var htmlSplitIdx = rawHtml.search(/Family Micro-Cards/i);
      if (htmlSplitIdx > -1) {
        topCommentary = rawHtml.slice(0, htmlSplitIdx);
      }
    }

    // Extract Primary Scripture reference (for Companion_Voices VersesReference)
    var detectedRefs = findRefs(rawText);
    var versesRef = detectedRefs.length > 0 ? detectedRefs[0] : "";

    // Extract Related Prayer (if present)
    var prayerStart = rawText.toLowerCase().indexOf('supplemental prayer');
    var extractedPrayer = "";
    if (prayerStart > -1) {
      var amenEnd = rawText.toLowerCase().indexOf('amen', prayerStart);
      if (amenEnd > -1) {
        extractedPrayer = rawText.slice(prayerStart + 19, amenEnd + 4).trim();
      }
    }

    // 2. PATCH Resources list (Matches Button9_2)
    logSync('Patching Resources item #' + targetRowId + ' (AdditionalCommentary)...');
    var patchUrl = 'https://graph.microsoft.com/v1.0/sites/' + siteId + '/lists/Resources/items/' + targetRowId + '/fields';
    
    var resourcesPayload = {
      AdditionalCommentary: topCommentary
    };
    if (extractedPrayer) {
      resourcesPayload.Related_Prayer = extractedPrayer;
    }

    var rRes = await fetch(patchUrl, {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(resourcesPayload)
    });

    if (!rRes.ok) {
      var errData = await rRes.json();
      logSync('⚠️ Resources patch warning: ' + (errData.error && errData.error.message || rRes.status));
    } else {
      logSync('✓ Resources #' + targetRowId + ' updated.');
    }

    // 3. Parse & Post Companion Voices (Matches Button9_2)
    var compStart = rawText.toLowerCase().indexOf('companion voices');
    if (compStart > -1) {
      var compEnd = (familySplitIdx > compStart) ? familySplitIdx : rawText.length;
      var compSection = rawText.slice(compStart, compEnd);
      
      var compLines = compSection.split('\n').filter(function(l){
        var trimmed = l.trim();
        return trimmed.length > 5 && (trimmed.includes(':') || trimmed.includes('—')) && !trimmed.startsWith('#');
      });

      logSync('Found ' + compLines.length + ' genuine Companion Voices. Posting...');

      for (var i = 0; i < compLines.length; i++) {
        var line = compLines[i];
        var sepIdx = line.indexOf(':') > -1 ? line.indexOf(':') : line.indexOf('—');
        var compName = line.slice(0, sepIdx).replace(/^[-*•#\s]+/, '').trim();
        var compContent = line.slice(sepIdx + 1).trim();

        var skipWords = ['verse', 'hook', 'reflect', 'pray', 'reference', 'hymn', 'refrain'];
        if (skipWords.includes(compName.toLowerCase())) continue;

        if (compName.length > 1 && compName.length < 50 && compContent.length > 5) {
          try {
            await fetch('https://graph.microsoft.com/v1.0/sites/' + siteId + '/lists/Companion_Voices/items', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                fields: {
                  Title: 'Companion Voice • ' + mmDdYyyyStr,
                  Companion: compName,
                  Voice: compContent.slice(0, 255),
                  Voice_Extended: topCommentary,
                  InsightDate: new Date(devoDate).toISOString(),
                  VersesReference: versesRef,
                  ResourceType: ($('devoSource').value.trim() || 'FCB')
                }
              })
            });
            logSync('  + Voice: ' + compName);
          } catch(e){}
        }
      }
    }

    // 4. Parse & Post Family Insights (Matches btnSaveEntry_3)
    logSync('Parsing Family Micro-Cards, Family Prayer & Refrain...');

    function getSlice(startRegex, endRegex) {
      var matchStart = familyRaw.search(startRegex);
      if (matchStart === -1) return '';
      
      var sub = familyRaw.slice(matchStart);
      if (!endRegex) return sub.trim();
      
      // Look for the end token inside the remaining substring
      var matchEnd = sub.search(endRegex);
      if (matchEnd > -1) {
        return sub.slice(0, matchEnd).trim();
      }
      return sub.trim();
    }

    // Slicing definitions strictly matching btnSaveEntry_3
    var wesleyText  = getSlice(/(?:^|\n)\s*\*?\*?Wesley\s*[-—–]/i,       /(?:^|\n)\s*\*?\*?Mac\s*[-—–]/i);
    var macText     = getSlice(/(?:^|\n)\s*\*?\*?Mac\s*[-—–]/i,          /(?:^|\n)\s*\*?\*?Jonathan\s*[-—–]/i);
    var jonText     = getSlice(/(?:^|\n)\s*\*?\*?Jonathan\s*[-—–]/i,     /(?:^|\n)\s*\*?\*?Kim\s*[-—–]/i);
    var kimText     = getSlice(/(?:^|\n)\s*\*?\*?Kim\s*[-—–]/i,          /(?:^|\n)\s*\*?\*?Rob\s*[-—–]/i);
    var robText     = getSlice(/(?:^|\n)\s*\*?\*?Rob\s*[-—–]/i,          /(?:^|\n)\s*#*\s*\*?\*?Family Prayer/i);
    var famPrayText = getSlice(/(?:^|\n)\s*#*\s*\*?\*?Family Prayer/i,   /(?:^|\n)\s*#*\s*\*?\*?Refrain/i);
    var refrainText = getSlice(/(?:^|\n)\s*#*\s*\*?\*?Refrain/i,         /(?:^|\n)\s*#*\s*\*?\*?Hymn Line/i);

    var familyPayloads = [
      { person: 'Wesley',        title: 'Insight • Wesley • ' + monthDayStr,       content: wesleyText },
      { person: 'Mac',           title: 'Insight • Mac • ' + monthDayStr,          content: macText },
      { person: 'Jonathan',      title: 'Insight • Jonathan • ' + monthDayStr,     content: jonText },
      { person: 'Kim',           title: 'Insight • Kim • ' + monthDayStr,          content: kimText },
      { person: 'Rob',           title: 'Insight • Rob • ' + monthDayStr,          content: robText },
      { person: 'FamilyInsight', title: 'Family Insight • ' + monthDayStr,         content: famPrayText },
      { person: 'Family',        title: 'Family Theme Line • ' + monthDayStr,      content: refrainText }
    ];

    for (var j = 0; j < familyPayloads.length; j++) {
      var item = familyPayloads[j];
      if (item.content) {
        try {
          var postRes = await fetch('https://graph.microsoft.com/v1.0/sites/' + siteId + '/lists/Family_Insights/items', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fields: {
                Title: item.title,
                InsightDate: new Date(devoDate).toISOString(),
                Person: item.person,
                AnswerHtml: item.content.replace(/\n/g, '<br>')
              }
            })
          });

          if (postRes.ok) {
            logSync('  + Saved: ' + item.title);
          } else {
            var errF = await postRes.json();
            logSync('  ⚠️ ' + item.person + ' error: ' + (errF.error && errF.error.message || postRes.status));
          }
        } catch(e){
          logSync('  ❌ ' + item.person + ' exception: ' + e.message);
        }
      } else {
        logSync('  ⚠️ Content was blank for: ' + item.person);
      }
    }

    logSync('🎉 COMPLETE! Devotional, Companion Voices, and all 7 Family records synced.');
    toast('All devotional components saved to SharePoint!');
  }
  // Pre-load accounts if already cached
  var cachedAccs=msalApp.getAllAccounts();
  if(cachedAccs.length>0) updateUserUI(cachedAccs[0]);

  // Apply default mode
  applyMode(mode);
})();
</script>
</body>
</html>
